name: Test published package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pypi:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4.2.1
    - uses: actions/setup-python@v5.2.0
      with:
        python-version: ${{ matrix.version }}

    - name: Prepare venv
      run: |
        python -m pip install --upgrade pip
        python -m venv venv

    - name: Install dependencies (Unix(-like))
      if: ${{ matrix.os != 'windows-latest' }}
      run: ./venv/bin/pip install netargparse requests
    - name: Install dependencies (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: ./venv/Scripts/pip install netargparse requests

    - name: Get pip path (Unix(-like))
      if: ${{ matrix.os != 'windows-latest' }}
      run: echo "PIP=./venv/bin/pip" >> $GITHUB_ENV
      shell: bash
    - name: Get pip path (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: echo "PIP=./venv/Scripts/pip" >> $GITHUB_ENV
      shell: bash

    - name: Verify version
      run: |
        ver_toml=$(grep "version = " pyproject.toml | cut -d\" -f2)
        ver_pip=$($PIP freeze | grep netargparse | cut -d= -f3)
        if [ "$ver_toml" = "$ver_pip" ]; then
            exit 0
        else
            exit 1
        fi
      shell: bash

    - name: Run tests (Unix(-like))
      if: ${{ matrix.os != 'windows-latest' }}
      run: ./venv/bin/python tests/test_netargparse.py
    - name: Run tests (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: ./venv/Scripts/python tests/test_netargparse.py
